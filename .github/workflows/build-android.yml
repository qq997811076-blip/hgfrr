name: Build Android APKs

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.60.0-beta.2）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: packages/desktop/go.sum

      # 固定 JDK 17（2026-11-14）：runner 自带的 JDK 已升到 25（class file
      # major 69），生成 Gradle 8.9 wrapper 用的系统 Gradle 9.x 不支持 ——
      # 「编译 APK」直接挂在 semantic analysis。Gradle 8.9 / AGP 8.7 的
      # 兼容 JDK 是 17，显式固定住，不跟随 runner 漂移。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 自带 Android SDK 与 NDK，
      # 这里只需要确认路径与版本。
      - name: 准备 Android 工具链
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "--- SDK:"; ls "${ANDROID_HOME}" | head -10
          echo "--- NDK:"; ls "${ANDROID_HOME}/ndk" || echo "（没有预装 NDK）"

      - name: 安装依赖
        run: npm ci

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 构建内核与界面
        run: |
          npm run build -w @cfpilot/worker-core
          npm run build -w @cfpilot/ui
          node scripts/gen-desktop-icons.mjs

      - name: 把界面与内核资产塞进 Go 包
        # 与桌面版同一套：界面与内核资产都是 go:embed 进二进制的，
        # 所以 APK 里的 .so 与桌面版 exe 装的是**同一份**资源。
        run: node scripts/build-desktop.mjs --assets-only

      - name: 编译安卓内核（c-shared → .so）
        # 每个 ABI 一份 .so，放进 jniLibs 由 Gradle 打进 APK。
        #
        # ⚠️ 必须 CGO_ENABLED=1：-buildmode=c-shared 走 cgo，
        #    交叉编译器由 NDK 提供（CC / CXX 指向 NDK 里的 clang）。
        run: |
          set -euo pipefail
          cd packages/desktop
          # ⚠️ 不要引用 ${ANDROID_NDK_VERSION} —— runner 上没有这个环境变量，
          #    而 set -u 会让未定义变量直接终止脚本。
          # 优先用 27.x：Go 1.24 的 cgo 与它配合最稳（NDK 28+ 换了 clang 默认值）。
          NDK_BIN=""
          for d in "${ANDROID_HOME}"/ndk/27.*; do
            if [ -d "$d/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
              NDK_BIN="$d/toolchains/llvm/prebuilt/linux-x86_64/bin"
              break
            fi
          done
          if [ -z "$NDK_BIN" ]; then
            NDK_BIN="$(ls -d "${ANDROID_HOME}"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK_BIN" ]; then
            echo "::error::找不到 NDK 的 clang 工具链（${ANDROID_HOME}/ndk 下有什么？）"
            ls -la "${ANDROID_HOME}/ndk" || true
            exit 1
          fi
          echo "NDK 工具链：$NDK_BIN"

          # 两个 ABI：
          #   arm64-v8a   —— 现代手机全是它
          #   armeabi-v7a —— 32 位老设备
          #
          # ⚠️ API level 用 24（比 minSdk 26 低）—— 编译时能用的系统 API 更少，
          #    在 26+ 的机器上跑反而更安全；NDK 的 clang 包装器也一定有这个档位。
          for abi in arm64-v8a armeabi-v7a; do
            case "$abi" in
              arm64-v8a)   GOARCH=arm64; CLANG=aarch64-linux-android24-clang ;;
              armeabi-v7a) GOARCH=arm;   CLANG=armv7a-linux-androideabi24-clang ;;
            esac
            echo "--- $abi（GOARCH=$GOARCH，$CLANG）"
            "$NDK_BIN/$CLANG" --version | head -2
            OUT=../android/app/src/main/jniLibs/$abi
            mkdir -p "$OUT"
            GOOS=android GOARCH=$GOARCH CGO_ENABLED=1 \
              CC="$NDK_BIN/$CLANG" \
              CXX="$NDK_BIN/$CLANG++" \
              go build -tags jnilib -buildmode=c-shared -o "$OUT/libcfpilot.so" \
              -ldflags="-s -w -X main.Version=${{ steps.ver.outputs.version }}" \
              ./cmd/cfpilot-android
            ls -la "$OUT"

            # ⚠️ 必须确认 JNI 符号真的在 .so 里。
            #
            # JVM 是**按名字**找符号的（Java_<包>_<类>_<方法>）：
            # 符号不在库里，运行时就是 UnsatisfiedLinkError —— 而这个错误
            # 只在真机上才暴露，编译期完全看不出来。
            #
            # 所以这里硬校验：符号表里必须有这两个。
            for sym in Java_com_xmwengxing_cfpilot_NativeBridge_nativeStart \
                       Java_com_xmwengxing_cfpilot_NativeBridge_nativeStop; do
              if ! nm -D "$OUT/libcfpilot.so" | grep -q " T $sym$"; then
                echo "::error::$OUT/libcfpilot.so 里缺少 JNI 符号 $sym"
                nm -D "$OUT/libcfpilot.so" | grep Java_ || true
                exit 1
              fi
              echo "  ✓ 符号 $sym"
            done
          done

      - name: 验证 JNI 契约（真 JVM 调用）
        # ⚠️ 这一步验的是「安卓端到底能不能用」。
        #
        #    JNI 的符号是 JVM **按名字**找的，编译期与链接期都检查不出来。
        #    比如返回类型写成 char* 而不是 jstring：编译通过、链接通过、CI 全绿，
        #    只在真机上炸成满屏乱码（2026-11-11 实测踩过）。
        #
        #    这里用**真的 JVM** 调一遍：同名类、同名方法、同样的符号查找方式，
        #    与手机上的路径完全一致。Go 内核也换成 linux 版 —— 里面那套逻辑与安卓版相同，
        #    差别只在目标平台。
        run: |
          set -euo pipefail
          cd packages/desktop
          OUT="$(mktemp -d)"

          # jni.h 在 JDK 里，得把 include 目录喂给 cgo。
          # （JNI 那套代码挂在 jnilib 标签下，普通构建不需要它。）
          JAVA_INC="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")/include"
          echo "jni.h 目录：$JAVA_INC"
          test -f "$JAVA_INC/jni.h"

          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 \
            CGO_CFLAGS="-I$JAVA_INC -I$JAVA_INC/linux" \
            go build -tags jnilib -buildmode=c-shared -o "$OUT/libcfpilot.so" \
            -ldflags="-X main.Version=ci-check" ./cmd/cfpilot-android

          echo "--- .so 里的 JNI 符号"
          nm -D "$OUT/libcfpilot.so" | grep Java_ || true

          SRC=../android/tools/jnicheck/com/xmwengxing/cfpilot
          rm -rf /tmp/jnicheck && mkdir -p /tmp/jnicheck/classes /tmp/jnicheck/data
          cp "$SRC"/*.java /tmp/jnicheck/
          javac -d /tmp/jnicheck/classes /tmp/jnicheck/*.java
          java -cp /tmp/jnicheck/classes -Djava.library.path="$OUT" \
            com.xmwengxing.cfpilot.JniCheck /tmp/jnicheck/data

      - name: 编译 APK
        working-directory: packages/android
        run: |
          set -euo pipefail
          # 固定 Gradle 版本。
          #
          # ⚠️ wrapper 必须在**空目录**里生成 ——
          #    `gradle wrapper` 会先配置（也就是编译）当前项目的构建脚本，
          #    在项目目录里跑的话，用的是 runner 上那个 Gradle 9.x，
          #    而 AGP 8.7 不兼容 Gradle 9 → 直接在生成 wrapper 那一步就挂。
          #
          # 在空目录里生成就没有脚本可编译，wrapper 只是几个文件。
          rm -rf /tmp/wrap && mkdir -p /tmp/wrap
          # Gradle 要求根目录里有 settings.gradle 或 build.gradle 才认这是一个 build，
          # 空目录直接跑 wrapper 会被拒（"does not contain a Gradle build"）。
          # 一行 rootProject.name 就够 —— 这里没有任何脚本要编译。
          printf "rootProject.name = 'wrap'\n" > /tmp/wrap/settings.gradle
          cd /tmp/wrap
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          cp -r gradle gradlew gradlew.bat /home/runner/work/CFPilot/CFPilot/packages/android/
          chmod +x /home/runner/work/CFPilot/CFPilot/packages/android/gradlew
          cd /home/runner/work/CFPilot/CFPilot/packages/android
          ./gradlew --no-daemon :app:assembleRelease
          ls -la app/build/outputs/apk/release/

          # 确认两个 ABI 真的都进包了。
          #
          # ⚠️ 只编 arm64 的话，包是能打出来的 —— 但 32 位设备装不上，
          #    而且这事**不会报错**，只会在用户手机上表现为「装不了」。
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK：$APK"
          for abi in arm64-v8a armeabi-v7a; do
            if ! unzip -l "$APK" | grep -q "lib/$abi/libcfpilot.so"; then
              echo "::error::APK 里缺少 lib/$abi/libcfpilot.so"
              unzip -l "$APK" | grep 'lib/' || true
              exit 1
            fi
            echo "  ✓ lib/$abi"
          done

      - name: 给 APK 起名字
        # ⚠️ Gradle 产出的名字是 app-release.apk ——
        #    用户在 Release 页面看到这个名字不知道是哪个版本。
        run: |
          set -euo pipefail
          cd packages/android/app/build/outputs/apk/release
          SRC=$(ls *.apk | head -1)
          mv "$SRC" "cfpilot-${{ steps.ver.outputs.version }}-android.apk"
          ls -la

      - name: 上传 APK（构建产物）
        uses: actions/upload-artifact@v4
        with:
          name: CFPilot-android-${{ steps.ver.outputs.version }}
          path: packages/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 把 APK 追加到 Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.ver.outputs.version }}"
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "等待桌面发布任务创建 Release（$i/30）..."
            sleep 20
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" packages/android/app/build/outputs/apk/release/*.apk --clobber

